# This file stores configurations for your Shopify app.

# Learn more about configuring your app:
# https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "802736d4abe8d72dcc197ecdce6b7bfa"
name = "Smart COD"
handle = "smart-cod"
application_url = "https://smartcodform.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = "fab-gadget-5ssd1kdj.myshopify.com"

[access_scopes]
# Scopes needed:
# - write_orders / read_orders: create COD draft orders
# - write_draft_orders / read_draft_orders: build & convert draft orders
# - read_products / read_product_listings: show product data on the form
# - write_discounts: apply quantity-offer / bundle discounts
scopes = "write_orders,write_draft_orders,read_products,write_discounts,read_customers,write_customers,read_themes"

[auth]
redirect_urls = [
  "https://smartcodform.vercel.app/auth/callback",
  "https://smartcodform.vercel.app/auth/shopify/callback",
  "https://smartcodform.vercel.app/api/auth/callback"
]


[webhooks]
api_version = "2024-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app_subscriptions/update"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

[pos]
embedded = false

[app_proxy]
url = "https://smartcodform.vercel.app/api"
subpath = "cod"
prefix = "apps"
# With this config, a storefront request to /apps/cod/cod-submit
# is proxied by Shopify to https://your-app-url.com/api/cod-submit
